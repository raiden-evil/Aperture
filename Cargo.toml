[package]
name = "aperture"
version = "1.0.0"
edition = "2024"
description = "Aperture - ultra lightweight screenshot tool for Windows and Linux"
build = "build.rs"

[[bin]]
name = "Aperture"
path = "src/main.rs"

# ---- Windows backend only (none of this is compiled for Linux) ----
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Direct3D_Fxc", "Win32_Media_MediaFoundation", "Win32_Devices_Display", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_HiDpi",
    "Win32_UI_Controls",
    "Win32_System_LibraryLoader",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_Storage_FileSystem",
    "Win32_Security",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# ---- Linux backend only (none of this is compiled for Windows) ----
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["x11", "wayland", "wayland-dlopen", "rwh_06"] }
softbuffer = { version = "0.4", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
ab_glyph = "0.2"
ashpd = { version = "0.14", default-features = false, features = ["async-io", "screenshot", "screencast", "file_chooser", "global_shortcuts"] }
x11rb = { version = "0.13", features = ["allow-unsafe-code"] }
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
arboard = { version = "3", default-features = false, features = ["image-data"] }
png = "0.17"
pollster = "0.4"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
libc = "0.2"

# ---- Debian package (on Debian: `cargo install cargo-deb && cargo deb`) ----
[package.metadata.deb]
name = "aperture"
maintainer = "raiden-evil"
copyright = "raiden-evil"
extended-description = """\
Region, freeform and full-screen screenshots with a built-in annotation \
toolbar (text, blur, black bar, arrow, line, pencil), clipboard history, \
global shortcuts and a tray icon. Works on Wayland and X11."""
section = "graphics"
priority = "optional"
depends = "libc6, libxkbcommon0, libxkbcommon-x11-0, libwayland-client0, libwayland-cursor0, libx11-6, libx11-xcb1, libxcursor1, libxi6, libxrandr2, fontconfig, xdg-desktop-portal, xdg-utils, gstreamer1.0-tools, gstreamer1.0-plugins-base, gstreamer1.0-plugins-good, gstreamer1.0-plugins-bad, gstreamer1.0-plugins-ugly, gstreamer1.0-pipewire"
recommends = "wl-clipboard, libnotify-bin, gstreamer1.0-vaapi, xdg-desktop-portal-gnome | xdg-desktop-portal-kde | xdg-desktop-portal-wlr, gnome-shell-extension-appindicator"
assets = [
    ["target/release/Aperture", "usr/bin/aperture", "755"],
    ["packaging/linux/aperture.desktop", "usr/share/applications/", "644"],
    ["assets/aperture.png", "usr/share/icons/hicolor/256x256/apps/aperture.png", "644"],
    ["README.md", "usr/share/doc/aperture/README.md", "644"],
]
